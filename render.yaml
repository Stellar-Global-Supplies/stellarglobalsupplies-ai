services:
  # ── Backend API ──────────────────────────────────────────────
  - type: web
    name: gemini-clone-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false          # set in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GROQ_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: ENT_DATABASE_URL
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: gemini-clone-ui
          type: web
          property: host

  # ── Frontend ─────────────────────────────────────────────────
  - type: web
    name: gemini-clone-ui
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars: []
